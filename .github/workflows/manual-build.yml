name: Manual Docker Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'ビルドするタグ名 (例: kb23.1, kb21.10-lts)'
        required: true
      push_latest:
        description: 'latest / latest-lts タグも更新する？'
        type: boolean
        default: true

jobs:
  build:
    name: Docker イメージビルド (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: kmyblue
            dockerfile: ./Dockerfile
          - name: kmyblue-streaming
            dockerfile: ./streaming/Dockerfile

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch and checkout upstream tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/kmycode/mastodon.git || true
          git fetch upstream "refs/tags/$TAG:refs/tags/$TAG" --no-tags

          # タグが fork にまだなければ push
          if ! git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            git push origin "refs/tags/$TAG"
            echo "タグ $TAG を fork に push しました"
          fi

          git checkout "refs/tags/$TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.PAT_TOKEN }}

      - name: Determine Docker tags
        id: tags
        env:
          TAG: ${{ inputs.tag }}
          PUSH_LATEST: ${{ inputs.push_latest }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/mastodon/${{ matrix.name }}
        run: |
          TAGS="${IMAGE}:${TAG}"
          if [ "$PUSH_LATEST" = "true" ]; then
            if [[ "$TAG" != *"-lts"* ]]; then
              TAGS="${TAGS},${IMAGE}:latest"
            else
              TAGS="${TAGS},${IMAGE}:latest-lts"
            fi
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "ビルドするタグ: $TAGS"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          build-args: |
            MASTODON_VERSION_METADATA=kmyblue
